<form action="https://formspree.io/f/xdaqpyqa" method="POST" enctype="multipart/form-data">
    
    <!-- Disable Captcha for smooth driver experience -->
    <input type="hidden" name="_captcha" value="false">
    
    <!-- Custom Email Subject -->
    <input type="hidden" name="_subject" value="New Carrier Onboarding Submission - Mastermind Matrix">

    <div class="form-grid">
        <!-- Standard Inputs -->
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required placeholder="John">
        </div>
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required placeholder="Doe">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="driver@example.com">
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="(555) 555-5555">
        </div>
        <div class="form-group">
            <label for="mcDot">MC / DOT Number</label>
            <input type="text" id="mcDot" name="mcDot" required placeholder="Enter MC or DOT #">
        </div>
        <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" name="companyName" required placeholder="LLC or Inc.">
        </div>

        <!-- Document Uploads (Optional) -->
        <div class="form-group full-width">
            <h3 style="color: #fff; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; font-weight: 500; letter-spacing: 1px;">Required Documents (Optional)</h3>
        </div>
        
        <div class="form-group">
            <label>W-9 Form</label>
            <input type="file" name="w9" accept=".pdf, .jpg, .jpeg, .png">
        </div>
        <div class="form-group">
            <label>Certificate of Insurance (COI)</label>
            <input type="file" name="coi" accept=".pdf, .jpg, .jpeg, .png">
        </div>
        <div class="form-group">
            <label>Notice of Assignment (NOA)</label>
            <input type="file" name="noa" accept=".pdf, .jpg, .jpeg, .png">
        </div>
        <div class="form-group">
            <label>Driver's License</label>
            <input type="file" name="license" accept=".pdf, .jpg, .jpeg, .png">
        </div>
        <div class="form-group full-width" style="border-top: none; padding-top: 0; margin-top: 0;">
            <label>Certificate of Authority</label>
            <input type="file" name="authority" accept=".pdf, .jpg, .jpeg, .png">
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <button type="submit" class="btn">Submit Credentials</button>
    </div>
</form>
